<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
html{cursor:grab}html{scroll-padding-top:env(safe-area-inset-top,0px)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}
.mini{position:fixed;z-index:6;top:0;left:0;right:0;padding:calc(20px + env(safe-area-inset-top,0px)) 3.3vw 0;display:flex;justify-content:space-between;color:#fff;font-size:12px;letter-spacing:.06em;font-weight:500;opacity:0;pointer-events:none;transition:opacity .4s}
.mini a{color:#fff;text-decoration:none;pointer-events:auto}
.cap{position:fixed;z-index:6;left:3.3vw;bottom:calc(6vh + env(safe-area-inset-bottom,0px));color:#fff;max-width:min(520px,84vw);opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s;pointer-events:none;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.cap.on{opacity:1;transform:none}
.cap small{font-size:12px;font-weight:500;opacity:.85}
.cap h2{font-size:clamp(34px,5vw,74px);font-weight:600;letter-spacing:-.035em;line-height:1;margin:8px 0 12px}
.cap p{font-size:14px;line-height:1.55;opacity:.92;max-width:380px}
.shade{position:fixed;z-index:2;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.3)),linear-gradient(transparent 65%,rgba(0,0,0,.4));pointer-events:none;opacity:0;transition:opacity .5s}
.prog{position:fixed;z-index:6;right:3.3vw;top:50%;transform:translateY(-50%);width:2px;height:120px;background:rgba(255,255,255,.3);opacity:0;transition:opacity .4s}
.prog b{display:block;width:100%;height:0;background:#fff}
@media (prefers-reduced-motion:reduce){.hint i{animation:none}.cap,.ghost{transition:none}}
#ld{position:fixed;inset:0;z-index:9;background:#111;display:grid;place-items:center;font-size:12px;letter-spacing:.3em;transition:opacity .8s;pointer-events:none}.sh{position:fixed;z-index:6;right:3.3vw;bottom:calc(4vh + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.14em;transition:opacity .5s;text-shadow:0 1px 12px rgba(0,0,0,.55);pointer-events:none}.dbg{position:fixed;z-index:10;left:8px;top:44px;max-width:60vw;font:10px/1.35 monospace;color:#ffe27a;white-space:pre-wrap;pointer-events:none;text-shadow:0 0 4px #000}</style></head><body>
